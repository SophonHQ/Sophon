name=SophonTestConfiguration
appenders = console

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d [%t] %-5p %-30.30c{1} %x - %m%n

rootLogger.level = info
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = STDOUT
# Main
logger.sophon.name = org.sophonhq.sophon
logger.sophon.level = INFO
logger.sophon.additivity = false
logger.sophon.appenderRefs = stdout
logger.sophon.appenderRef.stdout.ref = STDOUT
# Messaging
logger.chaining-converter.name = org.sophonhq.sophon.serialization.ChainingConverter
logger.chaining-converter.level = OFF
# Sophon - Spring Boot
logger.sophon-spring-boot-auto-config.name = org.sophonhq.sophon.springboot.autoconfig
logger.sophon-spring-boot-auto-config.level = WARN
logger.sophon-spring-boot-util.name = org.sophonhq.sophon.springboot.util
logger.sophon-spring-boot-util.level = ERROR
# Spring
logger.spring-test.name = org.springframework.test
logger.spring-test.level = WARN
logger.spring-boot-test.name = org.springframework.boot.test
logger.spring-boot-test.level = WARN
# Test
logger.reactorless-test.name = org.sophonhq.sophon.reactorlesstest.ReactorlessStartupTest
logger.reactorless-test.level = WARN

