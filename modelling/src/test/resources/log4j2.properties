name=SophonTestConfiguration
appenders = console

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d [%t] %-5p %-30.30c{1} %x - %m%n

rootLogger.level = info
rootLogger.appenderRefs = stdout
rootLogger.appenderRef.stdout.ref = STDOUT
# Main
logger.sophon.name = org.sophonhq.sophon
logger.sophon.level = INFO
logger.sophon.additivity = false
logger.sophon.appenderRefs = stdout
logger.sophon.appenderRef.stdout.ref = STDOUT
# Messaging
logger.chaining-converter.name = org.sophonhq.sophon.serialization.ChainingConverter
logger.chaining-converter.level = OFF
logger.logging-callback.name = org.sophonhq.sophon.commandhandling.callbacks.LoggingCallback
logger.logging-callback.level = ERROR
# Sagas
logger.jdbc-saga-store.name = org.sophonhq.sophon.modelling.saga.repository.jdbc.JdbcSagaStore
logger.jdbc-saga-store.level = ERROR
# Storage
logger.hibernate.name = org.hibernate
logger.hibernate.level = WARN
# Caching
logger.ehcache-configuration-factory.name = org.ehcache.config.ConfigurationFactory
logger.ehcache-configuration-factory.level = ERROR
# Spring
logger.spring-orm.name = org.springframework.orm
logger.spring-orm.level = WARN
logger.spring-test.name = org.springframework.test
logger.spring-test.level = WARN
# Token store
logger.in-memory-token-store.name = org.sophonhq.sophon.eventhandling.tokenstore.inmemory.InMemoryTokenStore
logger.in-memory-token-store.level = ERROR
