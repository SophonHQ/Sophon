site:
  title: Sophon
  url: https://docs.sophonhq.org
  start_page: sophon-reference::index.adoc

content:
  sources:
  - url: ../..
    # the checked-out branch (read from the worktree), main as the development version, and every release line
    branches: [HEAD, main, 'sophon-*.*.x']
    start_paths: ['docs/*', '!docs/_*']

asciidoc:
  attributes:
    experimental: true
    page-pagination: true
    kroki-fetch-diagram: true
  extensions:
  - asciidoctor-kroki
  - '@asciidoctor/tabs'

antora:
  extensions:
  - id: prerelease-by-branch
    require: ./extensions/prerelease-by-branch.js
  - id: lunr
    require: '@antora/lunr-extension'
    enabled: true
    index_latest_only: true

runtime:
  fetch: true # fetch remote repos
  log:
    level: info
    failure_level: error

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
